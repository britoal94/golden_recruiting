name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Check & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # Mirrors Vercel's build image (24.x); Temporal comes via --harmony-temporal in npm scripts.
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
        env:
          SITE_URL: https://goldenrecruiting.com
