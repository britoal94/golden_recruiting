name: Dependabot auto-merge

on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    # Only Dependabot's own PRs, only in this repo (not forks).
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.repository == 'britoal94/golden_recruiting'
    runs-on: ubuntu-latest
    env:
      PR_URL: ${{ github.event.pull_request.html_url }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Merge policy:
      #   minor/patch (any dep)        -> merge when green
      #   major, devDependency         -> merge when green (tooling only; a
      #                                   passing check+build is the proof)
      #   major, production dependency -> never auto-merge; a human reviews
      - name: Decide merge policy
        id: policy
        run: |
          TYPE="${{ steps.metadata.outputs.update-type }}"
          DEP="${{ steps.metadata.outputs.dependency-type }}"
          if [ "$TYPE" = "version-update:semver-major" ] && [ "$DEP" != "direct:development" ]; then
            echo "mergeable=false" >> "$GITHUB_OUTPUT"
          else
            echo "mergeable=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Flag production major for review
        if: steps.policy.outputs.mergeable == 'false'
        run: gh pr comment "$PR_URL" --body "Major version bump of a production dependency — not auto-merged. Please review the changelog and merge manually."

      # Verify the bump on the PR's own tree before merging. This is what
      # gates the merge, so it works without branch-protection rules.
      - uses: actions/checkout@v7
        if: steps.policy.outputs.mergeable == 'true'
      - uses: actions/setup-node@v7
        if: steps.policy.outputs.mergeable == 'true'
        with:
          node-version: 24
          cache: npm
      - name: Install, check and build
        id: verify
        if: steps.policy.outputs.mergeable == 'true'
        run: |
          npm ci
          npm run check
          npm run build
        env:
          SITE_URL: https://goldenrecruiting.com

      - name: Merge
        if: steps.policy.outputs.mergeable == 'true' && steps.verify.outcome == 'success'
        run: gh pr merge --squash --delete-branch "$PR_URL"

      # If verification fails, leave one explanatory comment (not one per
      # weekly rebase). Dependabot keeps rebasing the PR; when the upstream
      # blocker clears the next run goes green and merges.
      - name: Explain why it's waiting
        if: failure() && steps.verify.outcome == 'failure'
        run: |
          MARKER="<!-- auto-merge-waiting -->"
          if ! gh pr view "$PR_URL" --json comments --jq '.comments[].body' | grep -q "$MARKER"; then
            gh pr comment "$PR_URL" --body "$MARKER
          Auto-merge is waiting: \`npm ci\` / \`astro check\` / build failed with this bump (see the workflow log). This usually means a peer dependency doesn't support the new version yet. The PR will be re-tested on each Dependabot rebase and merged automatically once it passes."
          fi
